name: su-se-framover
services:
    # Mock av Entra ID (Azure AD). Utsteder tokens lokalt og eksponerer JWKS.
    # tokenCallbacks legger på aud/NAVident/groups slik at både su-se-framover og
    # su-se-bakover får de claims-ene de trenger (se .docker/mock-oauth2-config.json).
    # Merk: su-se-bakover kobler seg mot den samme serveren på http://localhost:4321/default.
    mock-oauth2-server:
        container_name: mock-oauth2-server
        image: ghcr.io/navikt/mock-oauth2-server:2.1.2
        ports:
            - 4321:4321
        environment:
            TZ: Europe/Oslo
            SERVER_PORT: 4321
            JSON_CONFIG_PATH: /tmp/mock-oauth2-config.json
        volumes:
            - ./.docker/mock-oauth2-config.json:/tmp/mock-oauth2-config.json:ro
        restart: unless-stopped
        hostname: mock-oauth2-server

    # Login-proxy (som i NAIS via azure.sidecar). Håndterer /oauth2/* selv,
    # auto-login, og proxer resten videre til Vite (frontend) med Bearer-token.
    # Åpne appen lokalt på http://localhost:3000 (ikke lenger :1234 direkte).
    wonderwall:
        container_name: wonderwall
        image: ghcr.io/nais/wonderwall:latest
        depends_on:
            - mock-oauth2-server
        ports:
            - 3000:3000
        environment:
            WONDERWALL_ENCRYPTION_KEY: YWJjZGVmZ2hpajEyMzQ1Njc4OTBhYmNkZWZnaGlqMTI=
        command: >
            --auto-login=true
            --openid.client-id=supstonad
            --openid.client-secret=not-so-secret
            --openid.well-known-url=http://localhost:4321/default/.well-known/openid-configuration
            --ingress=http://localhost:3000
            --bind-address=0.0.0.0:3000
            --upstream-host=host.docker.internal:1234
            --cookie.secure=false
            --log-level=info
            --log-format=text
        restart: on-failure
        extra_hosts:
            # Wonderwall må nå mock-oauth2-server på 'localhost:4321' (samme URL som
            # brukeren i nettleseren blir redirigert til), og Vite på host.
            - localhost:host-gateway
            - host.docker.internal:host-gateway
