apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
  name: su-se-framover
  namespace: supstonad
  labels:
    team: supstonad
spec:
  port: 8080
  image: {{ image }}
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no
      claims:
        extra:
          - "NAVident"
        groups:
          - id: "d75164fa-39e6-4149-956e-8404bc9080b6" # 0000-GA-SU-UFOR-ATTESTANT
          - id: "0ba009c4-d148-4a51-b501-4b1cf906889d" # 0000-GA-SU-UFOR-VEILEDER
          - id: "062d4814-8538-4f3a-bcb9-32821af7909a" # 0000-GA-SU-UFOR-SAKSBEHANDLER
          - id: "5ccd88bd-58d6-41a7-9652-5e0597b00f9b" # 0000-GA-SU-UFOR-DRIFT
    sidecar:
      enabled: true
      autoLogin: true
  replicas:
    min: 1
  liveness:
    path: isAlive
    port: 8080
    initialDelay: 5
  readiness:
    path: isReady
    port: 8080
    initialDelay: 5
  ingresses:
    - https://supstonad.intern.dev.nav.no
  env:
      - name: NODE_ENV
        value: production
      - name: SU_SE_BAKOVER_URL
        value: http://su-se-bakover
      - name: NPM_CONFIG_CACHE
        value: /tmp
      - name: AZURE_GROUP_ATTESTANT
        value: "d75164fa-39e6-4149-956e-8404bc9080b6"
      - name: AZURE_GROUP_VEILEDER
        value: "062d4814-8538-4f3a-bcb9-32821af7909a"
      - name: AZURE_GROUP_SAKSBEHANDLER
        value: "0ba009c4-d148-4a51-b501-4b1cf906889d"
      - name: AZURE_GROUP_DRIFT
        value: "5ccd88bd-58d6-41a7-9652-5e0597b00f9b"
      - name: SU_SE_BAKOVER_AAD_APP_NAME
        value: "dev-gcp.supstonad.su-se-bakover"
      - name: LOG_LEVEL
        value: "debug"
      - name: APP_ENV
        value: "dev"
      - name: UMAMI_SCRIPT_URL
        value: "https://cdn.nav.no/team-researchops/sporing/sporing-dev.js"
      - name: UMAMI_WEBSITE_ID
        value: "4a94a655-d32e-4e3e-853e-997023f085f6"
  accessPolicy:
    outbound:
      rules:
        - application: su-se-bakover
          namespace: supstonad
          cluster: dev-gcp

