name: Test branch

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!main'

permissions: {}

jobs:
  run-tests:
    name: Tester, typekontroll, lint og bygg
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.1.0'
      - name: Ensure npm has release-age exclusion support
        run: |
          npm i -g npm@11.18.0
          npm -v
      - name: Install client dependencies
        run: npm ci --min-release-age 20 --ignore-scripts
      - name: Install server dependencies
        run: npm ci --min-release-age 20 --ignore-scripts --prefix server
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build client
        run: npm run build
      - name: Build server
        run: npm run build:server
