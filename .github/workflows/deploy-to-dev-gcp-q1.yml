name: Deploy to dev-gcp-q1

on:
    workflow_dispatch:

permissions: {}

jobs:
    build-push-docker-image:
        name: build-push-docker-image
        runs-on: ubuntu-latest
        outputs:
            image: ${{ steps.docker-build-push.outputs.image }}
        permissions:
            packages: 'write'
            contents: 'read'
            id-token: 'write'
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: '24.1.0'
            - name: Ensure npm has min-release-age support
              run: |
                npm i -g npm@11.10.0
                npm -v
            - name: install-deps-client
              run: npm ci --min-release-age 20 --ignore-scripts
            - name: install-deps-server
              run: npm ci --min-release-age 20 --ignore-scripts --prefix server
            - name: lint-and-typecheck
              run: npm run lint-and-typecheck
            - name: build-client
              run: npm run build
            - name: build-server
              working-directory: server
              run: npm run build
            - name: Build and publish Docker image
              uses: nais/docker-build-push@v0
              id: docker-build-push
              with:
                  docker_context: .
                  team: supstonad
                  salsa: true
                  image_suffix: app
                  tag: ${{ github.sha }}

    deploy-to-dev-gcp-q1:
        name: deploy-to-dev-gcp-q1
        permissions:
            contents: read
            id-token: write
        needs: build-push-docker-image
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: nais/deploy/actions/deploy@v2
              env:
                  CLUSTER: dev-gcp
                  RESOURCE: .nais/dev-gcp-q1.yaml
                  VAR: image=${{ needs.build-push-docker-image.outputs.image }}
