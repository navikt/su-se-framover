name: Deploy alerts to NAIS
on:
    push:
        branches:
            - master
        paths:
            - 'alerts.yml'
            - '.github/workflows/alerts-deploy.yml'

permissions: { }

jobs:
    apply-alerts:
        name: Apply alerts to cluster
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: nais/setup@v1
              with:
                  team: supstonad
            - name: deploy to dev
              env:
                  K8S_CLUSTER_NAME: dev
                  LOGS_URL_LOKI: https://grafana.nav.cloud.nais.io/goto/efq0y6eulatc0c?orgId=1
              run: |
                  sed \
                    -e "s|{{K8S_CLUSTER_NAME}}|${K8S_CLUSTER_NAME}|g" \
                    -e "s|{{LOGS_URL_LOKI}}|${LOGS_URL_LOKI}|g" \
                    -e 's|{{LOGS_DETECTED_LEVEL_LINK}}||g' \
                    alerts.yml > "$RUNNER_TEMP/alerts-dev.yml"
                  nais apply "$RUNNER_TEMP/alerts-dev.yml" --environment dev-gcp --wait

            - name: deploy to prod
              env:
                  LOGS_URL_LOKI: https://grafana.nav.cloud.nais.io/goto/afvuvs1dzlk3ka?orgId=default
                  LOGS_DETECTED_LEVEL_LINK: ' Oppdaget nivå (detected_level): https://grafana.nav.cloud.nais.io/goto/s97pp9?orgId=default'
              run: |
                  # Preserve the existing empty value for the unset prod template variable.
                  sed \
                    -e 's|{{K8S_CLUSTER_NAME}}||g' \
                    -e "s|{{LOGS_URL_LOKI}}|${LOGS_URL_LOKI}|g" \
                    -e "s|{{LOGS_DETECTED_LEVEL_LINK}}|${LOGS_DETECTED_LEVEL_LINK}|g" \
                    alerts.yml > "$RUNNER_TEMP/alerts-prod.yml"
                  nais apply "$RUNNER_TEMP/alerts-prod.yml" --environment prod-gcp --wait
