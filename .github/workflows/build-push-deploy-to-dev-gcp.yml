name: Deploy to dev-gcp

on:
    workflow_dispatch:

permissions: {}

jobs:
    verify-master-is-ancestor:
      permissions:
        contents: read
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0
        - run: | # git merge-base returns 0 when master is ancestor, 1 if it is not (other positive numbers on error)
            set +e
            origin_master="$(git rev-parse origin/master)"
            head="$(git rev-parse HEAD)"
            echo "Hash for origin master: ${origin_master}. Hash for HEAD: ${head}."
            merge_base="$(git merge-base $origin_master HEAD)"
            echo "Merge-base: ${merge_base}"
            git merge-base --is-ancestor $origin_master HEAD
            return_code=$?
            echo "Return code of 'git merge-base': ${return_code}"
            if [[ return_code -gt 0 ]]; then
              echo "You have to merge origin/master before you can deploy a branch."
              exit 1
            fi
    build-push-docker-image:
        name: build-push-docker-image
        needs: verify-master-is-ancestor
        runs-on: ubuntu-latest
        outputs:
            image: ${{ steps.docker-build-push.outputs.image }}
        permissions:
            packages: 'write'
            contents: 'read'
            id-token: 'write'
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: '24.1.0'
            - name: Ensure npm has release-age exclusion support
              run: |
                npm i -g npm@11.18.0
                npm -v
            - name: install-deps-client
              run: npm ci --min-release-age 20 --ignore-scripts
            - name: install-deps-server
              run: npm ci --min-release-age 20 --ignore-scripts --prefix server
            - name: lint-and-typecheck
              run: npm run lint-and-typecheck
            - name: build-client
              run: npm run build
            - name: build-server
              working-directory: server
              run: npm run build
            - name: Build and publish Docker image
              uses: nais/docker-build-push@v0
              id: docker-build-push
              with:
                  docker_context: .
                  team: supstonad
                  salsa: true
                  image_suffix: app # hvis denne endres så må prod-deploy oppdateres likt
                  # Bruker default unik tag fra nais/docker-build-push (timestamp + short SHA)
                  # for å unngå at re-runs overskriver eksisterende image

    deploy-to-dev-gcp:
        name: deploy-to-dev-gcp
        permissions:
            contents: read
            id-token: write
        needs: build-push-docker-image
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: nais/deploy/actions/deploy@v2
              env:
                  CLUSTER: dev-gcp
                  RESOURCE: .nais/dev-gcp.yaml
                  VAR: image=${{ needs.build-push-docker-image.outputs.image }}
